name: release

# Build installers for Windows, Linux and macOS and publish a GitHub Release
# whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  # Fails in seconds with a readable message instead of after a 15-minute
  # matrix build, and says exactly which token setting is wrong.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASES_TOKEN can publish to the downloads repo
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          target="jocgeo/jokeGitViewer-Releases"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::secret RELEASES_TOKEN is empty or not set on this repo"
            exit 1
          fi
          # -o writes the body, -w prints just the status: no escapes needed
          code=$(curl -s -o body.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$target")
          echo "GET /repos/$target -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Token cannot see $target (HTTP $code). Fine-grained token: Repository access must be 'Only select repositories' -> $target, and Resource owner must be jocgeo."
            exit 1
          fi
          # A fine-grained token's real rights are NOT visible in
          # .permissions (that mirrors the ACCOUNT's access), so probe the
          # actual operation: create a draft release, then delete it again.
          probe=$(curl -s -o probe.json -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$target/releases" -d '{"tag_name":"ci-permission-probe","draft":true,"name":"permission probe"}')
          echo "POST /releases -> HTTP $probe"
          if [ "$probe" != "201" ]; then
            echo "::error::Token cannot create releases in $target (HTTP $probe). Fine-grained token needs Repository permissions -> Contents: Read and write on that repo. $(jq -r '.message // empty' probe.json)"
            exit 1
          fi
          id=$(jq -r ".id" probe.json)
          curl -s -X DELETE -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$target/releases/$id" >/dev/null
          echo "probe release $id created and removed again"
          echo "Token OK: can create releases in $target"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin" # one .dmg for Intel + Apple Silicon
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed for the changelog

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version to the tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p));j.version='$V';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "app version set to $V"

      # release notes = commit subjects since the previous version tag; this
      # body also lands in latest.json ("notes") so the in-app update banner
      # can show what changed.
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_REF_NAME"
            echo "changelog range: $range"
          else
            range="$GITHUB_REF_NAME"
            echo "first release — listing all commits"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's changed"
            git log "$range" --no-merges --pretty='- %s'
            echo ""
            echo "---"
            echo "Installers (.msi / .exe setup, .dmg, .deb) or the standalone build (portable .exe / .AppImage) — no install needed."
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          # RELEASES_TOKEN is a fine-grained PAT with Contents:read+write on the
          # downloads repo only. GITHUB_TOKEN cannot reach another repository.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # code-signing key for the auto-updater (set these as repo secrets)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # publish into the public downloads repo; the source repo can go private
          owner: jocgeo
          repo: jokeGitViewer-Releases
          tagName: ${{ github.ref_name }}
          releaseName: "jokeGITViewer ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # attaches the raw exe too — replaces the manual upload step
          uploadPlainBinary: true
          args: ${{ matrix.args }}

  # Transition shim: installations released before the move still ask the OLD
  # repo for updates. Mirroring just latest.json there lets them find the new
  # release — its URLs already point at the downloads repo, so they fetch the
  # binaries from there and come back with the new endpoint baked in.
  #
  # Turn this off once nobody runs a pre-move build: set the repository
  # variable STOP_LEGACY_MIRROR to "true" (Settings -> Secrets and variables
  # -> Actions -> Variables). No code change needed.
  mirror-updater-json:
    needs: build
    if: vars.STOP_LEGACY_MIRROR != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror latest.json into the old repo
        env:
          # the built-in token is scoped to THIS repo, which is the one we
          # publish the shim release into
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # the downloads repo is public, so no auth needed to read it back
          url="https://github.com/jocgeo/jokeGitViewer-Releases/releases/download/$TAG/latest.json"
          for i in 1 2 3 4 5; do
            curl -sfL -o latest.json "$url" && break
            echo "latest.json not published yet, retry $i"; sleep 10
          done
          test -s latest.json
          echo "mirroring:"; cat latest.json

          notes="Downloads have moved to [jokeGitViewer-Releases](https://github.com/jocgeo/jokeGitViewer-Releases/releases/latest).

          This release only carries \`latest.json\` so older installations can find the update. Get the installers from the link above."

          gh release create "$TAG" -R jocgeo/jokeGITViewer \
              --title "jokeGITViewer $TAG (downloads moved)" \
              --notes "$notes" latest.json \
            || gh release upload "$TAG" -R jocgeo/jokeGITViewer latest.json --clobber
